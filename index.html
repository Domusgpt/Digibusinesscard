<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mary Hennedy - Goldstone Realty</title>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8529;
            --black-bg: #0a0a0a;
            --dark-gray: #1a1a1a;
            --text-light: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            background-color: var(--black-bg);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Cinzel', serif;
        }

        /* Parallax Header */
        .parallax-header {
            position: relative;
            height: 60vh;
            min-height: 400px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .header-bg {
            position: absolute;
            top: -10%;
            left: 0;
            width: 100%;
            height: 120%; /* Extra height for parallax */
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1;
            /* Dark overlay to make text readable */
            filter: brightness(0.5) contrast(1.2);
        }

        .header-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(10,10,10,0.1) 0%, rgba(10,10,10,1) 100%);
            z-index: 2;
        }

        .header-content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2rem;
        }

        .profile-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            opacity: 0;
            transform: scale(0.8);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--black-bg);
        }

        .name-title {
            opacity: 0;
            transform: translateY(20px);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--gold-light);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        h2 {
            font-size: 1.1rem;
            color: var(--gold-primary);
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Content Section */
        .content-section {
            position: relative;
            z-index: 10;
            background-color: var(--black-bg);
            padding: 2rem 1.5rem 4rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-card {
            background: linear-gradient(145deg, #151515, #0a0a0a);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            margin-top: -60px; /* Overlap header slightly */
            position: relative;
            z-index: 20;
            opacity: 0;
            transform: translateY(40px);
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 1.2rem;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-light);
        }

        .contact-item:hover, .contact-item:active {
            background: rgba(212, 175, 55, 0.1);
            transform: translateX(5px);
            border-left: 3px solid var(--gold-primary);
        }

        .icon-wrapper {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 1.2rem;
            color: var(--gold-primary);
            font-size: 1.2rem;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .contact-item:hover .icon-wrapper, .contact-item:active .icon-wrapper {
            background: var(--gold-primary);
            color: var(--black-bg);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        .contact-info {
            overflow: hidden;
        }

        .contact-info h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-info p {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-light);
            word-break: break-word;
        }

        /* Action Buttons */
        .actions {
            margin-top: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn i {
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            color: var(--black-bg);
            box-shadow: 0 8px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover, .btn-primary:active {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: var(--gold-primary);
            border: 2px solid var(--gold-primary);
        }

        .btn-secondary:hover, .btn-secondary:active {
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-3px);
        }

        /* Decorative Elements */
        .gold-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            width: 100%;
            margin: 2.5rem 0;
            opacity: 0.6;
        }

        .footer {
            text-align: center;
            padding: 1rem;
            color: #777;
            font-size: 0.85rem;
        }

        .footer span {
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
            display: block;
            margin-top: 5px;
            font-size: 1rem;
        }

        /* Particles for elegance */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        @media (max-width: 380px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 0.9rem; letter-spacing: 2px; }
            .profile-container { width: 130px; height: 130px; }
        }
    </style>
</head>
<body>

    <header class="parallax-header" id="header">
        <div id="particles-js"></div>
        <div class="header-bg" id="headerBg"></div>
        <div class="header-overlay"></div>

        <div class="header-content">
            <div class="profile-container" id="profilePic">
                <img src="profile.jpg" alt="Mary Hennedy" class="profile-img">
            </div>

            <div class="name-title" id="nameTitle">
                <h1>Mary Hennedy</h1>
                <h2>Goldstone Realty</h2>
            </div>
        </div>
    </header>

    <section class="content-section">
        <div class="contact-card" id="contactCard">

            <a href="tel:+16095008446" class="contact-item">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div class="contact-info">
                    <h3>Phone</h3>
                    <p>+1 (609) 500-8446</p>
                </div>
            </a>

            <a href="mailto:maryhennedy@goldstonerealty.com" class="contact-item">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="contact-info">
                    <h3>Email</h3>
                    <p>maryhennedy@goldstonerealty.com</p>
                </div>
            </a>

            <a href="http://www.goldstonerealty.com" target="_blank" class="contact-item">
                <div class="icon-wrapper">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="contact-info">
                    <h3>Website</h3>
                    <p>goldstonerealty.com</p>
                </div>
            </a>

            <div class="actions">
                <a href="mary_hennedy.vcf" class="btn btn-primary" download="Mary_Hennedy.vcf">
                    <i class="fa-solid fa-address-card"></i> Save Contact
                </a>
                <button class="btn btn-secondary" onclick="shareCard()">
                    <i class="fa-solid fa-share-nodes"></i> Share Card
                </button>
            </div>
        </div>

        <div class="gold-line"></div>

        <div class="footer">
            <p>Building The Future with</p>
            <span>Goldstone Realty</span>
        </div>
    </section>

    <!-- Particles.js for subtle golden dust effect -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        // Initialize Particles
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 30, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#d4af37" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "random": true },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 1, "direction": "top", "random": true, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": { "events": { "onhover": { "enable": false }, "onclick": { "enable": false } } },
            "retina_detect": true
        });

        // Register GSAP ScrollTrigger
        gsap.registerPlugin(ScrollTrigger);

        // Initial Load Animations
        const tl = gsap.timeline();

        tl.to("#profilePic", {
            opacity: 1,
            scale: 1,
            duration: 1,
            ease: "back.out(1.5)",
            delay: 0.1
        })
        .to("#nameTitle", {
            opacity: 1,
            y: 0,
            duration: 0.8,
            ease: "power3.out"
        }, "-=0.6")
        .to("#contactCard", {
            opacity: 1,
            y: 0,
            duration: 0.8,
            ease: "power2.out"
        }, "-=0.4");

        // Parallax Effect for Header Background
        gsap.to("#headerBg", {
            yPercent: 20,
            ease: "none",
            scrollTrigger: {
                trigger: "#header",
                start: "top top",
                end: "bottom top",
                scrub: true
            }
        });

        // Animate contact items staggered
        gsap.from(".contact-item", {
            opacity: 0,
            x: -20,
            duration: 0.6,
            stagger: 0.15,
            ease: "power2.out",
            scrollTrigger: {
                trigger: "#contactCard",
                start: "top 85%",
            }
        });

        // Animate buttons
        gsap.from(".btn", {
            opacity: 0,
            y: 15,
            duration: 0.5,
            stagger: 0.1,
            ease: "power2.out",
            scrollTrigger: {
                trigger: ".actions",
                start: "top 90%",
            }
        });

        // Web Share API implementation
        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: 'Mary Hennedy - Goldstone Realty',
                    text: 'Here is my digital business card!',
                    url: window.location.href,
                })
                .catch((error) => console.log('Error sharing', error));
            } else {
                // Fallback to copy link
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('Link copied to clipboard!');
                });
            }
        }
    </script>
</body>
</html>
