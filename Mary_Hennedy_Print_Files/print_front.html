<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1125px;
    height: 675px;
    /* Pure black to ensure logo.jpg's black background blends seamlessly */
    background: #000000;
    color: white;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Subtle gold gradient overlay for texture, kept faint so black matches */
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% -20%, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .content {
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
    width: 100%;
    padding: 30px;
  }

  .top-section {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-bottom: 25px;
    gap: 60px; /* Space between logo and profile */
  }

  .logo {
    height: 190px;
    object-fit: contain;
    mix-blend-mode: screen; /* Helps blend if logo background is not perfectly pure black */
  }

  .profile {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #D4AF37;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.3);
  }

  .divider {
    width: 50%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
    margin: 20px 0;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    color: #D4AF37;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .title {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 5px;
    color: #cccccc;
    text-transform: uppercase;
  }

  .contact-info {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  .contact-item {
    font-size: 20px;
    font-weight: 400;
    color: #eeeeee;
    display: flex;
    align-items: center;
    gap: 14px;
    letter-spacing: 1px;
  }

  .icon {
    color: #D4AF37;
    font-size: 22px;
  }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <div class="top-section">
      <img src="logo.jpg" alt="Goldstone Realty" class="logo">
      <img src="profile.jpg" alt="Mary Hennedy" class="profile">
    </div>

    <div class="name">Mary Hennedy</div>
    <div class="title">REALTOR&reg;</div>

    <div class="divider"></div>

    <div class="contact-info">
      <div class="contact-item">
        <span class="icon">☏</span> +1 (609) 500-8446
      </div>
      <div class="contact-item">
        <span class="icon">✉</span> maryhennedy@goldstonerealty.com
      </div>
    </div>
  </div>
</body>
</html>
