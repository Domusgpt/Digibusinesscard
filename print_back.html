<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1125px;
    height: 675px;
    background: #000000;
    color: white;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .qr-container {
    background: transparent;
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 35px;
    position: relative;
    z-index: 2;
  }

  .qr-code {
    width: 300px;
    height: 300px;
    object-fit: contain;
    mix-blend-mode: screen;
  }

  .cta {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 400;
    color: #D4AF37;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    z-index: 2;
  }

  .cta-sub {
    margin-top: 15px;
    font-size: 16px;
    font-weight: 300;
    color: #aaaaaa;
    letter-spacing: 3px;
    text-transform: uppercase;
    z-index: 2;
  }

  /* Minimalist elegant frame */
  .frame {
    position: absolute;
    top: 30px;
    left: 30px;
    right: 30px;
    bottom: 30px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    pointer-events: none;
  }

  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2px solid #D4AF37;
  }
  .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
  .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
  .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

</style>
</head>
<body>
  <div class="overlay"></div>

  <div class="frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>

  <div class="qr-container">
    <img src="qrcode_gold_on_black.png" alt="QR Code" class="qr-code">
  </div>

  <div class="cta">Scan to Connect</div>
  <div class="cta-sub">Save Contact & View Digital Card</div>
</body>
</html>
